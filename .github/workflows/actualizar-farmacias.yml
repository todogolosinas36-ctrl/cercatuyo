name: Actualizar Farmacias de Turno

on:
  schedule:
    # Se ejecuta todos los días a las 11:05 UTC (08:05 hs de Argentina, 5 minutos después del cambio oficial de turno)
    - cron: '5 11 * * *'
  workflow_dispatch:
    # Permite ejecutar manualmente el flujo desde la pestaña 'Actions' de GitHub

# Permisos necesarios para que el bot pueda realizar push con los cambios
permissions:
  contents: write

jobs:
  actualizar:
    name: Extraer y actualizar farmacias de turno
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio (Checkout)
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: |
          npm ci || npm install

      - name: 💊 Ejecutar extractor de farmacias
        run: |
          node scripts/actualizarFarmacias.js

      - name: 🚀 Confirmar y subir cambios (Git Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/farmaciasTurno.json

          if ! git diff --cached --quiet; then
            FECHA_ACTUAL=$(date +'%Y-%m-%d')
            echo "✅ Se detectaron actualizaciones. Realizando commit..."
            git commit -m "Auto-update: Farmacias de turno [$FECHA_ACTUAL]"
            git push origin HEAD
          else
            echo "ℹ️ No hay cambios en data/farmaciasTurno.json. El archivo ya se encuentra actualizado."
          fi
